
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=900, initial-scale=1.0">
  <title>Actualización disponible</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/update.css">
</head>
<body>
  <div class="update-launcher-modal">
    <aside class="update-sidebar">
      <div class="logo">
        <img src="../assets/img/icon.png" alt="SeaxMusic Logo">
        <div>
          <span class="logo-title">SeaxMusic</span>
          <span class="logo-subtitle">Actualización</span>
        </div>
      </div>
      <div class="version-list" id="version-list">
        <!-- Cargando versiones... -->
      </div>
      <div class="sidebar-note">Explora los cambios y mejoras de esta nueva versión.</div>
    </aside>
    <main class="update-content">
      <div class="content-scroll">
        <header class="update-header">
          <div>
            <span class="update-badge">Nueva versión lista</span>
            <h1 id="main-version-title">Cargando...</h1>
            <p id="main-version-date" class="main-version-date"></p>
          </div>
          <div class="version-stat">
            <span id="commit-count" class="commit-count">--</span>
            <span id="release-source" class="release-source">GitHub Official Release</span>
            <a id="release-link" class="release-link" href="#" target="_blank" rel="noopener" hidden>Ver en GitHub</a>
          </div>
        </header>
        <section class="changelog-card">
          <span class="section-label">Notas de la versión</span>
          <div id="main-changelog" class="main-changelog">
            <p>Obteniendo detalles de la actualización...</p>
          </div>
        </section>
        <section class="commit-section" id="commit-section">
          <div class="section-header">
            <div>
              <span class="section-label">Historial de cambios</span>
            </div>
            <span id="commit-badge" class="commit-badge"></span>
          </div>
          <div class="commit-list" id="commit-list"></div>
        </section>
      </div>
      <div class="update-actions-fixed">
        <div class="action-help">Se requiere reiniciar para aplicar los cambios.</div>
        <button id="later-btn" class="secondary">Quizás luego</button>
        <button id="install-btn" class="primary">Actualizar ahora</button>
      </div>
    </main>
  </div>
  <script src="../js/pages/update.js"></script>
</body>
</html>
